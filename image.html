<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muiz × Ngupi – 20ft Print</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 16px;
        }

        .sign {
            width: 100vw;
            max-width: 1200px;
            aspect-ratio: 10 / 1;
            display: flex;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }

        .sign>div {
            flex: 0 0 50%;
            overflow: hidden;
        }

        .sign img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls button {
            background: #f5b342;
            border: none;
            padding: 14px 40px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a1a1a;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(245, 179, 66, 0.4);
        }

        .controls button:hover {
            background: #ffc107;
            transform: scale(1.03);
        }

        .controls button:active {
            transform: scale(0.97);
        }

        #compositeCanvas {
            display: none;
        }

        .status {
            color: #ccc;
            margin-top: 12px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 600px;
        }

        .note {
            color: #888;
            font-size: 0.8rem;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Display the side‑by‑side preview -->
    <div class="sign">
        <div><img src="images/sign1.jpg" alt="Muiz Hot Chicken" id="imgLeft" /></div>
        <div><img src="images/sign2.png" alt="Ngupi Kopibazar" id="imgRight" /></div>
    </div>

    <div class="controls">
        <button id="downloadBtn">⬇ Download 20ft‑ready image</button>
    </div>
    <div class="status" id="status">⏳ Loading images…</div>
    <div class="note">Output: 24,000 × 2,400 px · JPEG max quality · ~150 MB (varies)</div>

    <canvas id="compositeCanvas"></canvas>

    <script>
        (function() {
            const imgLeft = document.getElementById('imgLeft');
            const imgRight = document.getElementById('imgRight');
            const canvas = document.getElementById('compositeCanvas');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');

            // ─── PRINT RESOLUTION ────────────────────────────
            // 20 ft = 240 inches, at 100 DPI → 24000 px wide
            // 2 ft  = 24 inches, at 100 DPI → 2400 px high
            const OUTPUT_WIDTH = 24000;
            const OUTPUT_HEIGHT = OUTPUT_WIDTH / 10; // 2400

            let leftLoaded = false;
            let rightLoaded = false;

            function compositeAndDownload(auto = true) {
                if (!leftLoaded || !rightLoaded) {
                    statusEl.textContent = '⚠️ Images not loaded yet. Please wait.';
                    return;
                }

                statusEl.textContent = '🖼️ Compositing 24k × 2.4k image… (may take a moment)';

                // Set canvas to high resolution
                canvas.width = OUTPUT_WIDTH;
                canvas.height = OUTPUT_HEIGHT;

                // Clear
                ctx.clearRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

                // Draw halves
                const halfWidth = OUTPUT_WIDTH / 2;
                // We use drawImage with source image natural dimensions to avoid distortion
                // but we just stretch them to fill each half (cover behaviour)
                ctx.drawImage(imgLeft, 0, 0, halfWidth, OUTPUT_HEIGHT);
                ctx.drawImage(imgRight, halfWidth, 0, halfWidth, OUTPUT_HEIGHT);

                statusEl.textContent = '✅ Composite ready. ' + (auto ? 'Downloading…' : 'Click again to save.');

                // Trigger download (for auto or manual)
                if (auto) {
                    // Short delay to let UI update
                    setTimeout(() => {
                        triggerDownload();
                    }, 400);
                }
            }

            function triggerDownload() {
                try {
                    // Use maximum quality (1.0) for JPEG
                    const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                    const link = document.createElement('a');
                    link.download = 'muiz_ngupi_20ft_24000x2400.jpg';
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    statusEl.textContent = '✅ Download started! (file may be ~150 MB)';
                } catch (e) {
                    statusEl.textContent = '❌ Download error. Try again.';
                    console.warn('Download error:', e);
                }
            }

            // ─── Image load handlers ──────────────────────────
            imgLeft.addEventListener('load', function() {
                leftLoaded = true;
                statusEl.textContent = 'Left image loaded.';
                checkAndComposite();
            });
            imgRight.addEventListener('load', function() {
                rightLoaded = true;
                statusEl.textContent = 'Right image loaded.';
                checkAndComposite();
            });

            // If images are already cached
            if (imgLeft.complete) leftLoaded = true;
            if (imgRight.complete) rightLoaded = true;
            if (imgLeft.complete && imgRight.complete) {
                // both loaded, but we need to ensure we composite after a tiny delay
                setTimeout(checkAndComposite, 100);
            }

            function checkAndComposite() {
                if (leftLoaded && rightLoaded) {
                    compositeAndDownload(true); // auto-download
                }
            }

            // ─── Manual button ──────────────────────────────
            downloadBtn.addEventListener('click', function() {
                if (!leftLoaded || !rightLoaded) {
                    statusEl.textContent = '⏳ Please wait for images to load.';
                    return;
                }
                // If canvas hasn't been drawn yet (e.g., auto-download failed), draw now
                if (canvas.width === 0) {
                    compositeAndDownload(false);
                } else {
                    // If already drawn, just download again
                    triggerDownload();
                }
            });

            // ─── Error handling ──────────────────────────────
            imgLeft.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign1.jpg';
            });
            imgRight.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign2.png';
            });
        })();
    </script>

</body>
</html>
