<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngupi – 10ft × 2ft 100 DPI</title>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 16px;
        }

        .sign {
            width: 100vw;
            max-width: 900px;
            aspect-ratio: 5 / 1;
            overflow: hidden;
            background: #06038D; /* custom deep blue */
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sign img {
            display: block;
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            background: #06038D; /* match container */
        }

        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls button {
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .controls button:active {
            transform: scale(0.97);
        }

        .btn-pdf {
            background: #e74c3c;
            color: #fff;
        }
        .btn-pdf:hover {
            background: #c0392b;
            transform: scale(1.03);
        }

        .btn-jpg {
            background: #f5b342;
            color: #1a1a1a;
        }
        .btn-jpg:hover {
            background: #ffc107;
            transform: scale(1.03);
        }

        #compositeCanvas {
            display: none;
        }

        .status {
            color: #ccc;
            margin-top: 12px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }

        .note {
            color: #888;
            font-size: 0.8rem;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Preview – image centered on #06038D background -->
    <div class="sign">
        <img src="images/sign2.jpg" alt="Ngupi Kopi Bazar" id="signImg" />
    </div>

    <div class="controls">
        <button class="btn-pdf" id="downloadPdfBtn">⬇ Download PDF (10ft × 2ft)</button>
        <button class="btn-jpg" id="downloadJpgBtn">⬇ Download JPEG</button>
    </div>
    <div class="status" id="status">⏳ Loading image…</div>
    <div class="note">
        Output: 12,000 × 2,400 px (100 DPI) · Image kept original aspect ratio · Background: #06038D
    </div>

    <canvas id="compositeCanvas"></canvas>

    <script>
        (function() {
            const signImg = document.getElementById('signImg');
            const canvas = document.getElementById('compositeCanvas');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');

            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const downloadJpgBtn = document.getElementById('downloadJpgBtn');

            // ─── 100 DPI for 10ft × 2ft ──────────────────────────────────
            const OUTPUT_WIDTH = 12000;
            const OUTPUT_HEIGHT = 2400;

            const PDF_WIDTH_PT = 10 * 12 * 72;
            const PDF_HEIGHT_PT = 2 * 12 * 72;

            // Custom background colour
            const BG_COLOR = '#06038D';

            let imageLoaded = false;
            let compositeReady = false;

            // ─── Draw image centered with aspect ratio preserved ──────
            function drawImageContain(img, dx, dy, dw, dh) {
                const iw = img.naturalWidth;
                const ih = img.naturalHeight;
                if (iw === 0 || ih === 0) return;

                const scale = Math.min(dw / iw, dh / ih);
                const dWidth = iw * scale;
                const dHeight = ih * scale;
                const xOffset = (dw - dWidth) / 2;
                const yOffset = (dh - dHeight) / 2;

                ctx.drawImage(img, 0, 0, iw, ih, dx + xOffset, dy + yOffset, dWidth, dHeight);
            }

            // ─── COMPOSITE ──────────────────────────────────────────────
            function compositeImage() {
                if (!imageLoaded) return;

                statusEl.textContent = '🖼️ Compositing 12k × 2.4k image (contain, #06038D bg)…';

                canvas.width = OUTPUT_WIDTH;
                canvas.height = OUTPUT_HEIGHT;

                // Fill with custom deep blue
                ctx.fillStyle = BG_COLOR;
                ctx.fillRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

                drawImageContain(signImg, 0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

                compositeReady = true;
                statusEl.textContent = '✅ Composite ready – use buttons to download.';
            }

            // ─── DOWNLOAD: PDF ──────────────────────────────────────────
            function downloadPDF() {
                if (!compositeReady) {
                    statusEl.textContent = '⏳ Please wait, composite not ready.';
                    return;
                }

                try {
                    statusEl.textContent = '📄 Generating PDF (10ft × 2ft)…';

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('l', 'pt', [PDF_WIDTH_PT, PDF_HEIGHT_PT]);

                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    doc.addImage(imgData, 'JPEG', 0, 0, PDF_WIDTH_PT, PDF_HEIGHT_PT);

                    doc.save('ngupi_10ftx2ft_100dpi.pdf');

                    statusEl.textContent = '✅ PDF downloaded! (8640 × 1728 pt)';
                } catch (e) {
                    statusEl.textContent = '❌ PDF generation failed. Try again.';
                    console.warn('PDF error:', e);
                }
            }

            // ─── DOWNLOAD: JPEG ──────────────────────────────────────────
            function downloadJPEG() {
                if (!compositeReady) {
                    statusEl.textContent = '⏳ Please wait, composite not ready.';
                    return;
                }

                try {
                    statusEl.textContent = '📷 Generating JPEG…';
                    const link = document.createElement('a');
                    link.download = 'ngupi_10ftx2ft_12000x2400.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    statusEl.textContent = '✅ JPEG downloaded (max quality)!';
                } catch (e) {
                    statusEl.textContent = '❌ JPEG download error.';
                    console.warn('JPEG error:', e);
                }
            }

            // ─── IMAGE LOAD HANDLER ─────────────────────────────────────
            signImg.addEventListener('load', function() {
                imageLoaded = true;
                statusEl.textContent = 'Image loaded.';
                compositeImage();
            });

            if (signImg.complete) {
                imageLoaded = true;
                setTimeout(compositeImage, 100);
            }

            signImg.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign2.jpg';
            });

            downloadPdfBtn.addEventListener('click', downloadPDF);
            downloadJpgBtn.addEventListener('click', downloadJPEG);
        })();
    </script>

</body>
</html>
