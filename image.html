<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muiz × Ngupi – 20ft × 4ft 100 DPI</title>

    <!-- jsPDF for client‑side PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        /* ── preview: 20ft × 4ft → 5:1 aspect ratio ── */
        .sign {
            width: 100vw;
            max-width: 1200px;
            aspect-ratio: 5 / 1;
            display: flex;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }

        .sign>div {
            flex: 0 0 50%;
            overflow: hidden;
        }

        .sign img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls button {
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .controls button:active {
            transform: scale(0.97);
        }

        .btn-pdf {
            background: #e74c3c;
            color: #fff;
        }
        .btn-pdf:hover {
            background: #c0392b;
            transform: scale(1.03);
        }

        .btn-jpg {
            background: #f5b342;
            color: #1a1a1a;
        }
        .btn-jpg:hover {
            background: #ffc107;
            transform: scale(1.03);
        }

        #compositeCanvas {
            display: none;
        }

        .status {
            color: #ccc;
            margin-top: 12px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }

        .note {
            color: #888;
            font-size: 0.8rem;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Preview (side‑by‑side) -->
    <div class="sign">
        <div><img src="images/sign1.jpg" alt="Muiz Hot Chicken" id="imgLeft" /></div>
        <div><img src="images/sign2.png" alt="Ngupi Kopibazar" id="imgRight" /></div>
    </div>

    <div class="controls">
        <button class="btn-pdf" id="downloadPdfBtn">⬇ Download PDF (20ft × 4ft)</button>
        <button class="btn-jpg" id="downloadJpgBtn">⬇ Download JPEG</button>
    </div>
    <div class="status" id="status">⏳ Loading images…</div>
    <div class="note">
        Output: 24,000 × 4,800 px (100 DPI) · JPEG max quality · PDF page: 20ft × 4ft (17280 × 3456 pt)
    </div>

    <canvas id="compositeCanvas"></canvas>

    <script>
        (function() {
            const imgLeft = document.getElementById('imgLeft');
            const imgRight = document.getElementById('imgRight');
            const canvas = document.getElementById('compositeCanvas');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');

            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const downloadJpgBtn = document.getElementById('downloadJpgBtn');

            // ─── 100 DPI for 20ft × 4ft ──────────────────────────────────
            // 20 ft = 240 inches → 240 * 100 = 24 000 px wide
            //  4 ft =  48 inches →  48 * 100 =  4 800 px high
            const OUTPUT_WIDTH = 24000;
            const OUTPUT_HEIGHT = 4800; // (was 2400 for 2ft)

            // PDF page size in points (1 pt = 1/72 inch)
            const PDF_WIDTH_PT = 20 * 12 * 72; // 17280 pt
            const PDF_HEIGHT_PT = 4 * 12 * 72; // 3456 pt (was 1728)

            let leftLoaded = false;
            let rightLoaded = false;
            let compositeReady = false;

            // ─── COMPOSITE ────────────────────────────────────────────────
            function compositeImages() {
                if (!leftLoaded || !rightLoaded) return;

                statusEl.textContent = '🖼️ Compositing 24k × 4.8k image… (may take 5‑10 seconds)';

                canvas.width = OUTPUT_WIDTH;
                canvas.height = OUTPUT_HEIGHT;

                ctx.clearRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

                const halfWidth = OUTPUT_WIDTH / 2;
                ctx.drawImage(imgLeft, 0, 0, halfWidth, OUTPUT_HEIGHT);
                ctx.drawImage(imgRight, halfWidth, 0, halfWidth, OUTPUT_HEIGHT);

                compositeReady = true;
                statusEl.textContent = '✅ Composite ready (24 000 × 4 800 px). Downloading PDF…';

                // Auto‑download PDF after a short delay
                setTimeout(() => {
                    downloadPDF();
                }, 400);
            }

            // ─── DOWNLOAD: PDF (embeds the full 24k image) ──────────────
            function downloadPDF() {
                if (!compositeReady) {
                    statusEl.textContent = '⏳ Please wait, composite not ready.';
                    return;
                }

                try {
                    statusEl.textContent = '📄 Generating PDF (20ft × 4ft)… this may take a moment.';

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('l', 'pt', [PDF_WIDTH_PT, PDF_HEIGHT_PT]);

                    // Use maximum quality JPEG for the embedded image
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);

                    // Add image – it will be scaled to fill the entire PDF page
                    doc.addImage(imgData, 'JPEG', 0, 0, PDF_WIDTH_PT, PDF_HEIGHT_PT);

                    doc.save('muiz_ngupi_20ft_x_4ft_100dpi.pdf');

                    statusEl.textContent = '✅ PDF downloaded! (17280 × 3456 pt, ~100‑150 MB)';
                } catch (e) {
                    statusEl.textContent = '❌ PDF generation failed. Try again.';
                    console.warn('PDF error:', e);
                }
            }

            // ─── DOWNLOAD: JPEG (full 24k resolution) ────────────────────
            function downloadJPEG() {
                if (!compositeReady) {
                    statusEl.textContent = '⏳ Please wait, composite not ready.';
                    return;
                }

                try {
                    statusEl.textContent = '📷 Generating JPEG…';
                    const link = document.createElement('a');
                    link.download = 'muiz_ngupi_20ft_x_4ft_24000x4800.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    statusEl.textContent = '✅ JPEG downloaded (max quality, ~150‑200 MB)!';
                } catch (e) {
                    statusEl.textContent = '❌ JPEG download error.';
                    console.warn('JPEG error:', e);
                }
            }

            // ─── IMAGE LOAD HANDLERS ─────────────────────────────────────
            imgLeft.addEventListener('load', function() {
                leftLoaded = true;
                statusEl.textContent = 'Left image loaded.';
                compositeImages();
            });

            imgRight.addEventListener('load', function() {
                rightLoaded = true;
                statusEl.textContent = 'Right image loaded.';
                compositeImages();
            });

            // If images are already cached
            if (imgLeft.complete) leftLoaded = true;
            if (imgRight.complete) rightLoaded = true;
            if (imgLeft.complete && imgRight.complete) {
                setTimeout(compositeImages, 100);
            }

            imgLeft.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign1.jpg';
            });
            imgRight.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign2.png';
            });

            // ─── BUTTON BINDINGS ──────────────────────────────────────────
            downloadPdfBtn.addEventListener('click', downloadPDF);
            downloadJpgBtn.addEventListener('click', downloadJPEG);

        })();
    </script>

</body>
</html>
