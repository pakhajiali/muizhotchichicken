<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muix × Ngupi – 20ft × 4ft 100 DPI</title>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 16px;
        }

        .sign {
            width: 100vw;
            max-width: 1200px;
            aspect-ratio: 5 / 1;
            display: flex;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }

        .sign>div {
            flex: 0 0 50%;
            overflow: hidden;
        }

        .sign img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls button {
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .controls button:active {
            transform: scale(0.97);
        }

        .btn-pdf {
            background: #e74c3c;
            color: #fff;
        }
        .btn-pdf:hover {
            background: #c0392b;
            transform: scale(1.03);
        }

        .btn-jpg {
            background: #f5b342;
            color: #1a1a1a;
        }
        .btn-jpg:hover {
            background: #ffc107;
            transform: scale(1.03);
        }

        #compositeCanvas {
            display: none;
        }

        .status {
            color: #ccc;
            margin-top: 12px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }

        .note {
            color: #888;
            font-size: 0.8rem;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Preview (exact match to PDF) -->
    <div class="sign">
        <div><img src="images/sign1.jpg" alt="Muix Hot Chicken" id="imgLeft" /></div>
        <div><img src="images/sign2.png" alt="Ngupi Kopibazar" id="imgRight" /></div>
    </div>

    <div class="controls">
        <button class="btn-pdf" id="downloadPdfBtn">⬇ Download PDF (20ft × 4ft)</button>
        <button class="btn-jpg" id="downloadJpgBtn">⬇ Download JPEG</button>
    </div>
    <div class="status" id="status">⏳ Loading images…</div>
    <div class="note">
        Output: 24,000 × 4,800 px (100 DPI) · JPEG max quality · PDF page: 20ft × 4ft (17280 × 3456 pt)
    </div>

    <canvas id="compositeCanvas"></canvas>

    <script>
        (function() {
            const imgLeft = document.getElementById('imgLeft');
            const imgRight = document.getElementById('imgRight');
            const canvas = document.getElementById('compositeCanvas');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');

            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const downloadJpgBtn = document.getElementById('downloadJpgBtn');

            // ─── 100 DPI for 20ft × 4ft ──────────────────────────────────
            const OUTPUT_WIDTH = 24000;
            const OUTPUT_HEIGHT = OUTPUT_WIDTH / 5; // 4800

            const PDF_WIDTH_PT = 20 * 12 * 72; // 17280 pt
            const PDF_HEIGHT_PT = 4 * 12 * 72; // 3456 pt

            let leftLoaded = false;
            let rightLoaded = false;
            let compositeReady = false;

            // ─── object-fit: cover for canvas ────────────────────────────
            function drawImageCover(img, dx, dy, dw, dh) {
                const iw = img.naturalWidth;
                const ih = img.naturalHeight;
                if (iw === 0 || ih === 0) return;

                const scale = Math.max(dw / iw, dh / ih);
                const sw = dw / scale;
                const sh = dh / scale;
                const sx = (iw - sw) / 2;
                const sy = (ih - sh) / 2;

                ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
            }

            // ─── COMPOSITE ────────────────────────────────────────────────
            function compositeImages() {
                if (!leftLoaded || !rightLoaded) return;

                statusEl.textContent = '🖼️ Compositing 24k × 4.8k image (cover mode)…';

                canvas.width = OUTPUT_WIDTH;
                canvas.height = OUTPUT_HEIGHT;

                ctx.clearRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

                const halfWidth = OUTPUT_WIDTH / 2;

                // Left half – cover
                drawImageCover(imgLeft, 0, 0, halfWidth, OUTPUT_HEIGHT);
                // Right half – cover
                drawImageCover(imgRight, halfWidth, 0, halfWidth, OUTPUT_HEIGHT);

                compositeReady = true;
                statusEl.textContent = '✅ Composite ready (matches preview). Downloading PDF…';

                // Auto‑download PDF after short delay
                setTimeout(() => {
                    downloadPDF();
                }, 400);
            }

            // ─── DOWNLOAD: PDF ────────────────────────────────────────────
            function downloadPDF() {
                if (!compositeReady) {
                    statusEl.textContent = '⏳ Please wait, composite not ready.';
                    return;
                }

                try {
                    statusEl.textContent = '📄 Generating PDF (20ft × 4ft)…';

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('l', 'pt', [PDF_WIDTH_PT, PDF_HEIGHT_PT]);

                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    doc.addImage(imgData, 'JPEG', 0, 0, PDF_WIDTH_PT, PDF_HEIGHT_PT);

                    doc.save('muiz_ngupi_20ftx4ft_100dpi.pdf');

                    statusEl.textContent = '✅ PDF downloaded! (17280 × 3456 pt, ~150‑250 MB)';
                } catch (e) {
                    statusEl.textContent = '❌ PDF generation failed. Try again.';
                    console.warn('PDF error:', e);
                }
            }

            // ─── DOWNLOAD: JPEG ──────────────────────────────────────────
            function downloadJPEG() {
                if (!compositeReady) {
                    statusEl.textContent = '⏳ Please wait, composite not ready.';
                    return;
                }

                try {
                    statusEl.textContent = '📷 Generating JPEG…';
                    const link = document.createElement('a');
                    link.download = 'muiz_ngupi_20ftx4ft_24000x4800.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    statusEl.textContent = '✅ JPEG downloaded (max quality, ~150‑250 MB)!';
                } catch (e) {
                    statusEl.textContent = '❌ JPEG download error.';
                    console.warn('JPEG error:', e);
                }
            }

            // ─── IMAGE LOAD HANDLERS ─────────────────────────────────────
            imgLeft.addEventListener('load', function() {
                leftLoaded = true;
                statusEl.textContent = 'Left image loaded.';
                compositeImages();
            });

            imgRight.addEventListener('load', function() {
                rightLoaded = true;
                statusEl.textContent = 'Right image loaded.';
                compositeImages();
            });

            if (imgLeft.complete) leftLoaded = true;
            if (imgRight.complete) rightLoaded = true;
            if (imgLeft.complete && imgRight.complete) {
                setTimeout(compositeImages, 100);
            }

            imgLeft.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign1.jpg';
            });
            imgRight.addEventListener('error', () => {
                statusEl.textContent = '❌ Failed to load images/sign2.png';
            });

            downloadPdfBtn.addEventListener('click', downloadPDF);
            downloadJpgBtn.addEventListener('click', downloadJPEG);
        })();
    </script>

</body>
</html>
